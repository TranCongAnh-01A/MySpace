[package]
name = "lifehub"
version = "0.1.0"
description = "LifeHub - ứng dụng quản lý công việc local-first"
edition = "2021"
rust-version = "1.80"

[lib]
name = "lifehub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
rusqlite_migration = "2"
uuid = { version = "1", features = ["v7"] }
chrono = "0.4"
thiserror = "2"
ts-rs = "12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
