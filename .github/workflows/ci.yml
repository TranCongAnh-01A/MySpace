name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run version:check
      - run: npm run lint
      - run: npm test

      - name: Rust fmt
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Rust test
        run: cargo test
        working-directory: src-tauri

      - name: Build bộ cài NSIS
        uses: tauri-apps/tauri-action@v0
        with:
          # CI không có khoá ký updater: tắt tạo gói updater (bản phát hành thật nằm ở release.yml).
          args: --bundles nsis --config src-tauri/tauri.ci.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: lifehub-setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  # E2E (WebdriverIO + tauri-driver) chạy ở job riêng để không làm chậm job chính.
  # Dùng bản debug với LIFEHUB_DATA_DIR trỏ vào thư mục tạm nên không chạm dữ liệu nào khác.
  e2e:
    # Tạm không chặn: app khởi động bình thường nhưng WebView2 trên runner không tạo DevToolsActivePort nên
    # msedgedriver không kết nối được. Đã thử 2 giả thuyết (D3a, xem docs/log/log_20261128_d3a.md); E2E chạy trên máy trước mỗi lần phát hành.
    continue-on-error: true
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache tauri-driver
        id: tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-${{ runner.os }}-v2

      - name: Cài tauri-driver
        if: steps.tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - run: npm ci
      - name: Tải msedgedriver (khớp phiên bản WebView2)
        run: npm run e2e:setup
      - name: Build app (debug, không đóng gói)
        run: npm run e2e:build
      - name: Ghi phiên bản (chẩn đoán)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force e2e-logs | Out-Null
          $wv = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv
          "WebView2 Runtime: $wv" | Tee-Object e2e-logs/versions.txt -Append
          "msedgedriver: $(& .e2e/msedgedriver.exe --version)" | Tee-Object e2e-logs/versions.txt -Append

      - run: npm run e2e
        env:
          E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs

      - name: Tải log E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs
          if-no-files-found: ignore
