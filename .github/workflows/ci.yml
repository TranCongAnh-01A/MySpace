name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run version:check
      - run: npm run lint
      - run: npm test

      - name: Rust fmt
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Rust test
        run: cargo test
        working-directory: src-tauri

      - name: Build bộ cài NSIS
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: lifehub-setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  # E2E (WebdriverIO + tauri-driver) chạy ở job riêng để không làm chậm job chính.
  # Dùng bản debug với LIFEHUB_DATA_DIR trỏ vào thư mục tạm nên không chạm dữ liệu nào khác.
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache tauri-driver
        id: tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-${{ runner.os }}-v2

      - name: Cài tauri-driver
        if: steps.tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - run: npm ci
      - name: Tải msedgedriver (khớp phiên bản WebView2)
        run: npm run e2e:setup
      - name: Build app (debug, không đóng gói)
        run: npm run e2e:build
      - name: Chẩn đoán - phiên bản và chạy thử app
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force e2e-logs | Out-Null
          $log = 'e2e-logs/versions.txt'
          $wv = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv
          "WebView2 Runtime: $wv" | Tee-Object $log -Append
          "msedgedriver: $(& .e2e/msedgedriver.exe --version)" | Tee-Object $log -Append
          "Session: $([Environment]::UserInteractive) / $((Get-Process -Id $PID).SessionId)" | Tee-Object $log -Append

          function Test-App($name, $withWebviewDir) {
            $tmp = Join-Path $env:RUNNER_TEMP "smoke-$name"
            New-Item -ItemType Directory -Force $tmp | Out-Null
            $env:LIFEHUB_DATA_DIR = Join-Path $tmp 'data'
            $env:LIFEHUB_E2E = '1'
            if ($withWebviewDir) { $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $tmp 'webview2' } else { Remove-Item Env:WEBVIEW2_USER_DATA_FOLDER -ErrorAction SilentlyContinue }
            $p = Start-Process -FilePath src-tauri/target/debug/lifehub.exe -PassThru -RedirectStandardOutput "e2e-logs/smoke-$name-stdout.txt" -RedirectStandardError "e2e-logs/smoke-$name-stderr.txt"
            Start-Sleep -Seconds 15
            "== $name (webview dir riêng: $withWebviewDir) ==" | Tee-Object $log -Append
            if ($p.HasExited) { "App THOAT SOM, exit code $($p.ExitCode)" | Tee-Object $log -Append }
            else {
              $p.Refresh()
              "App song; Responding=$($p.Responding); MainWindowHandle=$($p.MainWindowHandle); Threads=$($p.Threads.Count)" | Tee-Object $log -Append
              $p.Kill()
            }
            "msedgewebview2 dang chay: $((Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Measure-Object).Count)" | Tee-Object $log -Append
            "Noi dung thu muc du lieu:" | Tee-Object $log -Append
            Get-ChildItem $tmp -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 40 -ExpandProperty FullName | Tee-Object $log -Append
            Copy-Item (Join-Path $env:LIFEHUB_DATA_DIR 'logs') "e2e-logs/smoke-$name-app-logs" -Recurse -ErrorAction SilentlyContinue
            Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Test-App 'a' $true
          Test-App 'b' $false

      - run: npm run e2e
        env:
          E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs

      - name: Tải log E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs
          if-no-files-found: ignore
