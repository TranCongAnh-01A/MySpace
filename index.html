<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeHub</title>
    <script>
      // Áp theme đã cache trước khi React chạy để không nháy màn hình.
      try {
        var t = localStorage.getItem('lifehub.theme');
        var dark =
          t === 'Dark' ||
          (t !== 'Light' && matchMedia('(prefers-color-scheme: dark)').matches !== false);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
